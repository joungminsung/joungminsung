<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Joung Minsung — AI Engineer, Technical PM and Full-Stack Developer</title>
  <desc id="desc">Building useful AI products. AI TOP 100 (CAMPUS) finalist, one of 100 finalists in 2026.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7be6c7"/>
      <stop offset="1" stop-color="#78a6f8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#adc4e4" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="330" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="330" fill="url(#background)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <circle cx="1160" cy="5" r="238" fill="none" stroke="#7be6c7" stroke-opacity=".09"/>
    <circle cx="1160" cy="5" r="194" fill="none" stroke="#7be6c7" stroke-opacity=".06"/>
    <path d="M56 286H1144" stroke="#24354a"/>
    <path d="M56 286H398" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="62" cy="56" r="5" fill="#7be6c7"/>
    <text x="80" y="61" fill="#a9c3d6" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" letter-spacing="3">PRODUCT × ENGINEERING</text>
    <text x="54" y="143" fill="#f4f7fc" font-family="DejaVu Sans,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2.5">Joung Minsung</text>
    <text x="58" y="184" fill="#b6c7db" font-family="DejaVu Sans,Arial,sans-serif" font-size="20">AI Engineer · Technical PM · Full-Stack Developer</text>
    <text x="58" y="247" fill="#7be6c7" font-family="DejaVu Sans Mono,monospace" font-size="14" letter-spacing="1.3">IDEAS → PROTOTYPES → PRODUCTS</text>
    <path d="M830 53V253" stroke="#314359"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
      <text x="872" y="70" fill="#8ca4bf" font-size="12" letter-spacing="2.4">RECOGNITION / 2026</text>
      <text x="870" y="120" fill="#f4f7fc" font-size="29" font-weight="700" letter-spacing="-1">AI TOP 100</text>
      <text x="872" y="151" fill="#b6c7db" font-size="18" letter-spacing="3.8">CAMPUS</text>
      <rect x="870" y="175" width="145" height="34" rx="7" fill="#153b36" stroke="#3a7b69"/>
      <text x="887" y="198" fill="#9df3d8" font-size="16" font-weight="700" letter-spacing="1.4">FINALIST</text>
      <text x="872" y="244" fill="#9cb1ca" font-size="15">One of 100 finalists</text>
    </g>
  </g>
</svg>
